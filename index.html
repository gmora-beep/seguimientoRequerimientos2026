<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Seguimiento de Requerimientos</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#f4f6f9;
}

h1{
    color:#004481;
    margin-bottom:20px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    min-width:180px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    margin:0;
    font-size:16px;
    font-weight:500;
}

.numero{
    font-size:34px;
    font-weight:bold;
    color:#004481;
    margin-top:10px;
}

input{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

th{
    background:#004481;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f5f9ff;
}

</style>

</head>
<body>

<h1>Seguimiento de Requerimientos</h1>

<div class="cards">

    <div class="card">
        <h3>Total</h3>
        <div id="total" class="numero">0</div>
    </div>

    <div class="card">
        <h3>En Desarrollo</h3>
        <div id="desarrollo" class="numero">0</div>
    </div>

    <div class="card">
        <h3>En Pruebas</h3>
        <div id="pruebas" class="numero">0</div>
    </div>

    <div class="card">
        <h3>Listo para Sprint</h3>
        <div id="sprint" class="numero">0</div>
    </div>

</div>

<input
id="buscar"
type="text"
placeholder="Buscar requerimiento, responsable o equipo..."
>

<table>

<thead>
<tr>
<th>ID</th>
<th>Requerimiento</th>
<th>Responsable</th>
<th>Prioridad</th>
<th>Estatus</th>
<th>Equipo</th>
</tr>
</thead>

<tbody id="tabla">
</tbody>

</table>

<script>

let datos = [];

function cargarDatos(data){

    console.log("Datos recibidos:", data);

    datos = data;

    renderizar(datos);
}

function renderizar(lista){

    const tabla = document.getElementById("tabla");

    tabla.innerHTML = "";

    let desarrollo = 0;
    let pruebas = 0;
    let sprint = 0;

    lista.forEach(item => {

        const estatus = (item.estatus || "").trim();

        if(estatus === "En desarrollo"){
            desarrollo++;
        }

        if(estatus === "En pruebas"){
            pruebas++;
        }

        if(estatus === "Listo para sprint"){
            sprint++;
        }

        tabla.innerHTML += `
        <tr>
            <td>${item.id || ""}</td>
            <td>${item.nombre || ""}</td>
            <td>${item.responsable || ""}</td>
            <td>${item.prioridad || ""}</td>
            <td>${item.estatus || ""}</td>
            <td>${item.equipo || ""}</td>
        </tr>
        `;
    });

    document.getElementById("total").innerText = lista.length;
    document.getElementById("desarrollo").innerText = desarrollo;
    document.getElementById("pruebas").innerText = pruebas;
    document.getElementById("sprint").innerText = sprint;
}

document.getElementById("buscar").addEventListener("input", function(){

    const texto = this.value.toLowerCase();

    const filtrados = datos.filter(item =>
        JSON.stringify(item)
        .toLowerCase()
        .includes(texto)
    );

    renderizar(filtrados);

});

</script>
src="https://script.google.com/macros/s/AKfycbx72WsrOFxUFiPPO_3m1Tke47bwPk4h_7UwQqZsw7AHmXiXamQDLFNb_vxDEF-S6ekp/exec?callback=cargarDatos"></</html>

</body>
</html>
